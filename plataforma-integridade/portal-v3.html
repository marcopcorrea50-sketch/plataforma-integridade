<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portal de Integridade Estrutural — Vale S11D</title>
<style>
  /* Mesmo sistema visual do InspectPro S11D v16 */
  :root {
    --accent: #0b7a5f; --accent-hover: #09664f; --accent-dim: rgba(11,122,95,0.09); --border-accent: rgba(11,122,95,0.30);
    --brand-900: #0a3a30;
    --ink: #0f172a; --ink-2: #334155; --ink-3: #64748b; --ink-4: #94a3b8;
    --line: #e2e8f0; --line-2: #cbd5e1; --surface-2: #f8fafc; --canvas: #eef1f4;
    --plan: #2563eb; --do: #0b7a5f; --check: #d97706; --act: #7c3aed; --base: #64748b;
    --shadow: 0 1px 2px rgba(15,23,42,0.05), 0 1px 3px rgba(15,23,42,0.07);
    --gutter: max(24px, calc((100% - 1240px) / 2));
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif; background: var(--canvas); color: var(--ink); font-size: 14px; line-height: 1.5; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }
  .ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ---- Cabeçalho (igual ao InspectPro) ---- */
  .app-header { background: var(--brand-900); padding: 12px var(--gutter); display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .app-brand { display: flex; align-items: center; gap: 14px; }
  .logo-grid { display: inline-grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 7px; border-radius: 6px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); }
  .logo-grid span { width: 9px; height: 9px; border-radius: 2px; }
  .app-header h1 { color: #fff; font-size: 18px; font-weight: 700; letter-spacing: .2px; display: flex; align-items: center; gap: 10px; }
  .app-version { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.75); border: 1px solid rgba(255,255,255,0.25); border-radius: 4px; padding: 1px 6px; }
  .app-header .subtitle { color: rgba(255,255,255,0.62); font-size: 12px; margin-top: 1px; }
  .app-header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .status { display: flex; align-items: center; gap: 7px; margin-right: 8px; font-size: 11.5px; color: rgba(255,255,255,0.7); }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: #34d399; }
  .hdr-btn { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.22);
    background: transparent; color: #fff; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: background .15s, border-color .15s; }
  .hdr-btn:hover { background: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.40); }

  /* ---- Barra de ferramentas (igual ao InspectPro) ---- */
  .action-bar { position: sticky; top: 0; z-index: 800; background: #fff; border-bottom: 1px solid var(--line); padding: 8px var(--gutter);
    display: flex; align-items: center; gap: 6px 18px; flex-wrap: wrap; }
  .toolbar-group { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
  .toolbar-group + .toolbar-group { padding-left: 18px; border-left: 1px solid var(--line); }
  .tb-btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 6px; border: 1px solid transparent; background: transparent;
    color: var(--ink-2); font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background .15s, color .15s, border-color .15s; }
  .tb-btn .ic { color: var(--ink-3); }
  .tb-btn .n { font-size: 11px; font-weight: 600; color: var(--ink-4); }
  .tb-btn:hover { background: var(--surface-2); border-color: var(--line); color: var(--ink); }
  .tb-btn:hover .ic { color: var(--accent); }
  .tb-btn.ativo { background: var(--accent); color: #fff; }
  .tb-btn.ativo .ic, .tb-btn.ativo .n { color: rgba(255,255,255,0.85); }
  .tb-btn .pt { width: 7px; height: 7px; border-radius: 50%; }
  .tb-direita { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .tb-busca { position: relative; }
  .tb-busca .ic { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-4); }
  .tb-busca input { width: 250px; height: 32px; padding: 0 30px 0 32px; border: 1px solid var(--line-2); border-radius: 6px; font: inherit; font-size: 12.5px; outline: none; background: #fff; }
  .tb-busca input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  .tb-busca kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font: 600 10.5px 'Segoe UI', sans-serif; color: var(--ink-4); border: 1px solid var(--line-2); border-radius: 4px; padding: 0 5px; }
  .tb-select { height: 32px; padding: 0 8px; border: 1px solid var(--line-2); border-radius: 6px; font: inherit; font-size: 12.5px; color: var(--ink-2); background: #fff; max-width: 230px; }

  /* ---- Conteúdo ---- */
  .form-container { max-width: 1240px; margin: 0 auto; padding: 28px 24px 40px; }
  .page-head { margin-bottom: 18px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .page-head h2 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .page-head p { font-size: 13px; color: var(--ink-3); margin-top: 3px; }
  .resumo { display: flex; gap: 8px; flex-wrap: wrap; }
  .resumo span { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 6px; background: #fff; border: 1px solid var(--line);
    font-size: 12px; color: var(--ink-3); box-shadow: var(--shadow); }
  .resumo b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .resumo i { width: 7px; height: 7px; border-radius: 50%; }

  .recentes { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .recentes > span { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-4); display: inline-flex; align-items: center; gap: 6px; }
  .recente { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2);
    font-size: 12.5px; font-weight: 600; color: var(--ink-2); max-width: 260px; }
  .recente span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .recente .ic { color: var(--accent); }
  .recente:hover { border-color: var(--border-accent); background: var(--accent-dim); color: var(--ink); }

  /* seção = igual às seções do formulário do InspectPro */
  .section { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .section-title { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; margin-bottom: 16px; border-bottom: 1px solid var(--line);
    font-size: 12.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink); }
  .section-title::before { content: ""; width: 3px; height: 14px; border-radius: 2px; background: var(--c, var(--accent)); }
  .section-title small { font-size: 11.5px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--ink-4); }
  .section-title em { margin-left: auto; font-style: normal; font-size: 11px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--ink-3);
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; }

  /* cartões = iguais aos tipos de equipamento do InspectPro */
  .template-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
  .template-card { position: relative; display: grid; grid-template-columns: 44px 1fr; column-gap: 14px; align-content: start; padding: 16px 16px 14px; background: #fff;
    border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); transition: border-color .15s, box-shadow .15s; }
  a.template-card:hover { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim), var(--shadow); }
  a.template-card:focus-visible { outline: 3px solid var(--border-accent); outline-offset: 2px; }
  .template-icon { grid-row: span 3; width: 44px; height: 44px; border-radius: 8px; background: var(--accent-dim); color: var(--accent); display: flex; align-items: center; justify-content: center; }
  .template-icon .ic { width: 22px; height: 22px; stroke-width: 1.6; }
  .template-title { font-size: 14.5px; font-weight: 650; color: var(--ink); margin: 1px 0 3px; padding-right: 46px; line-height: 1.3; }
  .template-desc { font-size: 12.5px; color: var(--ink-3); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .template-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 10px; font-size: 11.5px; color: var(--ink-3); }
  .template-meta .pt { width: 6px; height: 6px; border-radius: 50%; }
  .template-meta .grupo-meta { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .template-meta .sep { color: var(--line-2); }
  .template-id { position: absolute; top: 14px; right: 14px; font-size: 11px; font-weight: 600; color: var(--ink-4); font-variant-numeric: tabular-nums; }
  .selo { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; border: 1px solid; }
  .selo-alta { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }
  .selo-media { background: #fffbeb; border-color: #fde68a; color: #92400e; }
  .selo-baixa { background: #f0fdf4; border-color: #bbf7d0; color: #166534; }
  .selo-restrito { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; }
  .selo-restrito .ic { width: 11px; height: 11px; }
  .selo-breve { background: var(--surface-2); border-color: var(--line); color: var(--ink-3); }
  .template-card.em-breve { background: var(--surface-2); box-shadow: none; }
  .template-card.em-breve .template-icon { background: #eef1f4; color: var(--ink-4); }
  .template-card.em-breve .template-title { color: var(--ink-3); }

  /* lista */
  .lista .template-grid { grid-template-columns: 1fr; gap: 6px; }
  .lista .template-card { grid-template-columns: 36px 1fr auto; align-items: center; padding: 10px 14px; }
  .lista .template-icon { grid-row: auto; width: 36px; height: 36px; }
  .lista .template-icon .ic { width: 18px; height: 18px; }
  .lista .template-title { margin: 0; padding: 0; }
  .lista .template-desc { -webkit-line-clamp: 1; }
  .lista .template-meta { margin: 0; justify-content: flex-end; }
  .lista .template-id { position: static; }
  .lista .corpo { min-width: 0; }

  .vazio { text-align: center; padding: 40px 20px; color: var(--ink-3); background: #fff; border: 1px dashed var(--line-2); border-radius: 8px; }
  .vazio strong { display: block; color: var(--ink); font-size: 14.5px; margin-bottom: 4px; }
  .rodape { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line-2); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--ink-4); }

  @media (max-width: 1000px) { .tb-busca input { width: 180px; } }
  @media (max-width: 768px) {
    .toolbar-group + .toolbar-group { padding-left: 0; border-left: none; }
    .tb-direita { margin-left: 0; width: 100%; } .tb-busca { flex: 1; } .tb-busca input { width: 100%; }
    .status { width: 100%; }
    .form-container { padding: 18px 16px 32px; } .section { padding: 16px; }
    .lista .template-card { grid-template-columns: 36px 1fr; } .lista .template-meta { grid-column: 2; justify-content: flex-start; }
  }
</style>
</head>

const FASES = [
  { k: 'plan',  rot: 'Planejar', prat: [1,2,3], cor: 'var(--plan)',  ic: 'i-plan' },
  { k: 'do',    rot: 'Executar', prat: [4,5,6], cor: 'var(--do)',    ic: 'i-do' },
  { k: 'check', rot: 'Checar',   prat: [7,8],   cor: 'var(--check)', ic: 'i-check' },
  { k: 'act',   rot: 'Agir',     prat: [9,10],  cor: 'var(--act)',   ic: 'i-act' },
  { k: 'base',  rot: 'Documentos', prat: [],    cor: 'var(--base)',  ic: 'i-base' },
];
const ICONES = [
  [/prop[óo]sito/i,'m-alvo'], [/estrat[ée]gia/i,'m-bussola'], [/lideran/i,'m-lider'], [/dssma/i,'m-escudo'],
  [/pessoas/i,'m-pessoas'], [/inspectpro/i,'m-inspecao'], [/via de rolamento/i,'m-via'], [/risco/i,'m-risco'],
  [/laudo/i,'m-laudo'], [/atividade segura/i,'m-capacete'], [/baseline/i,'m-camadas'], [/instru[çc][ãa]o de tarefas/i,'m-tarefas'],
  [/material/i,'m-material'], [/rotina|performance/i,'m-painel'], [/programa[çc][ãa]o/i,'m-calendario'], [/notas/i,'m-notas'],
  [/auditori/i,'m-auditoria'], [/vibra[çc][ãa]o|instrumentada/i,'m-onda'], [/kaizen/i,'m-ideia'], [/mudan[çc]a/i,'m-ciclo'],
  [/drone/i,'m-drone'], [/treinamento/i,'m-treino'], [/documentos/i,'m-livro'], [/relat[óo]rio/i,'m-relatorio'],
];
const praticaNum = c => { const m = String(c).match(/Pr[áa]tica\s+(\d+)/); return m ? +m[1] : 0; };
const faseDe = c => (FASES.find(f => f.prat.includes(praticaNum(c))) || FASES[4]).k;
const fase = k => FASES.find(f => f.k === k);
const iconeDe = p => (ICONES.find(x => x[0].test(p.title)) || [0, 'm-relatorio'])[1];
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const nomePratica = c => String(c).split(/\s+[–-]\s+/).slice(1).join(' ') || c;
const rotuloPratica = c => praticaNum(c) ? 'Prática ' + praticaNum(c) + ' · ' + nomePratica(c) : c;
const disponiveis = () => MODULOS.filter(p => !p.emBreve);

let estado = { fase: 'todos', pratica: '', termo: '' }, vista = 'grade';
try { vista = localStorage.getItem('portal_vista') || 'grade'; } catch (e) {}
const recentes = () => { try { return JSON.parse(localStorage.getItem('portal_recentes') || '[]'); } catch (e) { return []; } };
function registrarAcesso(id) { try { const r = recentes().filter(x => x !== id); r.unshift(id); localStorage.setItem('portal_recentes', JSON.stringify(r.slice(0, 6))); } catch (e) {} }

function montarBarra() {
  const n = k => disponiveis().filter(p => k === 'todos' || faseDe(p.category) === k).length;
  document.getElementById('grupoFases').innerHTML =
    `<button type="button" class="tb-btn" data-fase="todos"><svg class="ic"><use href="#i-todos"/></svg>Todos <span class="n">${n('todos')}</span></button>`
    + FASES.map(f => `<button type="button" class="tb-btn" data-fase="${f.k}"><span class="pt" style="background:${f.cor}"></span>${f.rot} <span class="n">${n(f.k)}</span></button>`).join('');
  const cats = [...new Set(MODULOS.map(p => p.category))].sort((a, b) => (praticaNum(a) || 99) - (praticaNum(b) || 99));
  document.getElementById('selPratica').innerHTML = '<option value="">Todas as práticas</option>'
    + cats.map(c => `<option value="${esc(c)}">${esc(praticaNum(c) ? praticaNum(c) + '. ' + nomePratica(c) : c)}</option>`).join('');
}
function cartao(p) {
  const f = fase(faseDe(p.category)), pri = norm(p.priority);
  const pn = praticaNum(p.category);
  const meta = `<span class="grupo-meta" title="${esc(rotuloPratica(p.category))}"><span class="pt" style="background:${f.cor}"></span>${pn ? 'Prática ' + pn : 'Documentos'}`
    + (p.audience ? `<span class="sep">·</span>${esc(p.audience)}` : '') + `</span>`
    + (p.emBreve ? `<span class="selo selo-breve">Em construção</span>` : `<span class="selo selo-${esc(pri)}">${esc(p.priority || '')}</span>`)
    + (p.restrito ? `<span class="selo selo-restrito"><svg class="ic"><use href="#i-cadeado"/></svg>Acesso restrito</span>` : '');
  const corpo = `<span class="template-id">${esc(p.id)}</span>
    <span class="template-icon"><svg class="ic"><use href="#${iconeDe(p)}"/></svg></span>
    <div class="corpo"><div class="template-title">${esc(p.title)}</div><div class="template-desc">${esc(p.description)}</div></div>
    <div class="template-meta">${meta}</div>`;
  return p.emBreve ? `<div class="template-card em-breve" title="Módulo ainda não publicado">${corpo}</div>`
                   : `<a class="template-card" href="${esc(p.link)}" data-id="${esc(p.id)}">${corpo}</a>`;
}
function filtrados() {
  const q = norm(estado.termo).trim();
  return MODULOS.filter(p =>
    (estado.fase === 'todos' || faseDe(p.category) === estado.fase) &&
    (!estado.pratica || p.category === estado.pratica) &&
    (!q || norm([p.title, p.description, p.category, p.id, p.audience].join(' ')).includes(q)));
}
function render() {
  const lista = filtrados(), alvo = document.getElementById('modulos');
  alvo.className = vista === 'lista' ? 'lista' : '';
  document.querySelector('#btnVista span').textContent = vista === 'lista' ? 'Cartões' : 'Lista';
  document.querySelector('#btnVista use').setAttribute('href', vista === 'lista' ? '#i-todos' : '#i-lista');
  document.querySelectorAll('#grupoFases .tb-btn').forEach(b => b.classList.toggle('ativo', b.dataset.fase === estado.fase));
  try { history.replaceState(null, '', estado.fase === 'todos' ? location.pathname : '#fase=' + estado.fase); } catch (e) {}
  document.getElementById('selPratica').value = estado.pratica;
  const titulo = estado.pratica ? rotuloPratica(estado.pratica) : estado.fase === 'todos' ? 'Módulos do portal' : fase(estado.fase).rot;
  document.getElementById('titulo').textContent = titulo;
  const nb = lista.filter(p => p.emBreve).length, nd = lista.length - nb;
  document.getElementById('resumo').innerHTML = `<span><b>${nd}</b> disponíveis</span>` + (nb ? `<span><b>${nb}</b> em construção</span>` : '')
    + (estado.termo ? `<span>busca: <b>${esc(estado.termo)}</b></span>` : '');
  if (!lista.length) { alvo.innerHTML = '<div class="vazio"><strong>Nenhum módulo encontrado</strong>Tente outro termo ou volte para "Todos".</div>'; return; }
  alvo.innerHTML = FASES.map(f => {
    const g = lista.filter(p => faseDe(p.category) === f.k).sort((a, b) => praticaNum(a.category) - praticaNum(b.category));
    if (!g.length) return '';
    const sub = f.prat.length ? 'Práticas ' + f.prat.join(', ').replace(/, (\d+)$/, ' e $1') : 'Normas, procedimentos e treinamentos';
    return `<section class="section" style="--c:${f.cor}"><div class="section-title">${f.rot} <small>${sub}</small><em>${g.length} ${g.length === 1 ? 'módulo' : 'módulos'}</em></div>`
      + `<div class="template-grid">${g.map(cartao).join('')}</div></section>`;
  }).join('');
}
function renderRecentes() {
  const ids = recentes().filter(id => MODULOS.some(p => p.id === id && !p.emBreve)), el = document.getElementById('recentes');
  el.hidden = !ids.length;
  el.innerHTML = '<span><svg class="ic"><use href="#i-relogio"/></svg>Recentes</span>' + ids.map(id => {
    const p = MODULOS.find(x => x.id === id);
    return `<a class="recente" href="${esc(p.link)}" data-id="${esc(p.id)}"><svg class="ic"><use href="#${iconeDe(p)}"/></svg><span>${esc(p.title)}</span></a>`;
  }).join('');
}

document.addEventListener('click', ev => {
  const f = ev.target.closest('#grupoFases .tb-btn'); if (f) { estado.fase = f.dataset.fase; estado.pratica = ''; return render(); }
  const a = ev.target.closest('a[data-id]'); if (a) registrarAcesso(a.dataset.id);
});
document.getElementById('selPratica').addEventListener('change', e => { estado.pratica = e.target.value; if (e.target.value) estado.fase = faseDe(e.target.value); render(); });
document.getElementById('busca').addEventListener('input', e => { estado.termo = e.target.value; render(); });
document.getElementById('btnVista').addEventListener('click', () => { vista = vista === 'lista' ? 'grade' : 'lista'; try { localStorage.setItem('portal_vista', vista); } catch (e) {} render(); });
document.addEventListener('keydown', e => { if (e.key === '/' && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); document.getElementById('busca').focus(); } });
const hoje = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
document.getElementById('dataHoje').textContent = hoje.charAt(0).toUpperCase() + hoje.slice(1);
// fase vinda do endereço (atalhos da capa): portal-v3.html#fase=do
const hf = (location.hash.match(/fase=(\w+)/) || [])[1];
if (hf && (hf === 'todos' || fase(hf))) estado.fase = hf;
montarBarra(); renderRecentes(); render();
</script>
